name: Update libraries

# Rebuilds the library data files (ghdb.js, fingerprints.js, hunt.js) from their sources (tools/update-libraries.mjs).
# When the data changed and both test suites pass, the result is pushed to the branch auto/update-libraries and
# offered as a pull request. Nothing reaches the default branch until someone merges that pull request.
# Started by hand from any other branch, it is a dry run: it builds and tests, and publishes nothing.
on:
  schedule:
    - cron: '23 4 * * 1'      # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write             # to push the auto/update-libraries branch
  pull-requests: write        # to open the pull request

concurrency:
  group: update-libraries
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the libraries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download, rank and rebuild
        run: node tools/update-libraries.mjs
      - name: Anything new?
        id: diff
        run: |
          git status --short
          if git diff --quiet -- ghdb.js fingerprints.js hunt.js index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new in the sources." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo '```'; git diff --stat -- ghdb.js fingerprints.js hunt.js index.html; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Catalog lint (every row, and the order)
        if: steps.diff.outputs.changed == 'true'
        run: node tests/catalog.test.mjs
      - name: UI regression
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node tests/ui.test.mjs
      - name: Offer the change as a pull request
        if: steps.diff.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C auto/update-libraries
          git add ghdb.js fingerprints.js hunt.js index.html
          git commit -m "data: refresh the libraries from their sources"
          git push --force origin auto/update-libraries
          if [ "$(gh pr list --head auto/update-libraries --state open --json number --jq length)" != "0" ]; then
            echo "The open pull request now carries the new data." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "$BASE" --head auto/update-libraries \
              --title "data: refresh the libraries" \
              --body "Rebuilt by \`tools/update-libraries.mjs\` from the official sources. The catalog lint and the UI suite passed in [the run that made this]($RUN_URL); checks do not start by themselves on a pull request opened by a workflow, so close and reopen it if you want them here as well." \
            || echo "::warning::auto/update-libraries was pushed, but the pull request could not be opened. Allow it under Settings → Actions → General → Allow GitHub Actions to create and approve pull requests, or open it by hand."
          fi
