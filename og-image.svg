<?xml version="1.0" encoding="UTF-8"?>
<!-- Social preview (og:image / twitter:image). This is the source of og-image.png: render it at 1200×630.
     The numbers are checked by tests/catalog.test.mjs — keep them true. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.88" cy="0" r="0.75">
      <stop offset="0" stop-color="#5aa2ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0d0"/>
      <stop offset="1" stop-color="#5aa2ff"/>
    </linearGradient>
    <clipPath id="card"><rect x="72" y="352" width="1056" height="96" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#5aa2ff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Brand -->
  <path d="M74 91l20 20 42-42" stroke="url(#acc)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="107" fill="#e8edf6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Dork<tspan fill="#5aa2ff">Ops</tspan></text>
  <text x="1128" y="104" text-anchor="end" fill="#7d899d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24">dorks.bersec.me</text>

  <!-- Headline -->
  <g fill="#e8edf6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5">
    <text x="72" y="226">OSINT dorks,</text>
    <text x="72" y="306">scoped to <tspan fill="#ffd166">your target</tspan>.</text>
  </g>

  <!-- A dork as the app shows it: done tick, the query with the target highlighted, severity -->
  <rect x="72" y="352" width="1056" height="96" rx="16" fill="#131924"/>
  <rect x="72" y="352" width="9" height="96" fill="#ff9f43" clip-path="url(#card)"/>
  <rect x="73" y="353" width="1054" height="94" rx="15" fill="none" stroke="#2e3b52" stroke-width="2"/>
  <circle cx="132" cy="400" r="21" fill="#46d39a"/>
  <path d="M122 400.5l7 7 13.5-14.5" stroke="#04130c" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="274" y="376" width="232" height="48" rx="7" fill="#ffd166" fill-opacity="0.26"/>
  <text x="176" y="412" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" textLength="714" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre"><tspan fill="#7cc0ff">site:</tspan><tspan fill="#ffffff" font-weight="700">example.com</tspan><tspan fill="#7cc0ff"> intitle:</tspan><tspan fill="#9fd8ab">"index of"</tspan></text>
  <rect x="994" y="380" width="104" height="40" rx="8" fill="#ff9f43" fill-opacity="0.16" stroke="#ff9f43" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1046" y="408" text-anchor="middle" fill="#ffab5c" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">HIGH</text>

  <!-- Facts -->
  <text x="72" y="538" fill="#aab5c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" xml:space="preserve" style="white-space:pre"><tspan fill="#e8edf6" font-weight="800">300+</tspan> dorks<tspan fill="#56678a">   ·   </tspan><tspan fill="#e8edf6" font-weight="800">40+</tspan> engines<tspan fill="#56678a">   ·   </tspan>progress per target<tspan fill="#56678a">   ·   </tspan>one HTML file</text>
</svg>
